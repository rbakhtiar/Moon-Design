
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Design</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #101115;
  --panel: #17191f;
  --border: #292c35;
  --silver: #c4cbd9;
  --muted: #858b99;
  --accent: #9eafd2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: #e9eaf0;
  font-family: Inter, sans-serif;
  height: 100vh;
  overflow: hidden;
}

header {
  height: 62px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: #14161b;
}

.brand {
  font-family: Alegreya, serif;
  font-size: 25px;
  color: var(--silver);
  letter-spacing: 1px;
}

.brand span { color: #778bad; }

button, select, input {
  font: inherit;
}

button {
  background: #222630;
  border: 1px solid #353b48;
  color: #e5e8ef;
  padding: 9px 13px;
  border-radius: 7px;
  cursor: pointer;
}

button:hover {
  background: #303746;
}

button.active {
  background: #39455c;
  border-color: #8299c0;
}

.workspace {
  display: grid;
  grid-template-columns: 66px 220px 1fr 245px;
  height: calc(100vh - 62px);
}

.toolbar, .sidebar {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 12px;
}

.sidebar.right {
  border-right: none;
  border-left: 1px solid var(--border);
}

.tool {
  width: 100%;
  margin-bottom: 9px;
  padding: 12px 5px;
}

.panel-title {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1.5px;
  margin: 12px 0;
}

.layer {
  padding: 11px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 5px;
  border: 1px solid transparent;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.layer.selected {
  background: #30394b;
  border-color: #667b9e;
}

.stage {
  background-color: #0d0e12;
  background-image: radial-gradient(#292d37 1px, transparent 1px);
  background-size: 22px 22px;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px;
}

#canvas {
  width: 900px;
  height: 560px;
  background: white;
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: 0 15px 60px #0009;
}

.object {
  position: absolute;
  cursor: move;
  user-select: none;
  touch-action: none;
}

.object.selected {
  outline: 2px solid #648bc9;
  outline-offset: 2px;
}

#properties label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin: 17px 0 7px;
}

#properties input {
  width: 100%;
  background: #222630;
  color: white;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 9px;
}

#properties input[type=color] {
  height: 38px;
  padding: 3px;
}

.row {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.row button { flex: 1; }

.top-actions {
  display: flex;
  gap: 8px;
}

#status {
  font-size: 11px;
  color: var(--muted);
}

@media(max-width: 850px) {
  .workspace {
    grid-template-columns: 52px 1fr;
  }
  .sidebar.right { display: none; }
  .sidebar:not(.right) { display: none; }
  .stage { padding: 20px; }
  #canvas {
    transform: scale(.7);
    transform-origin: center;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">☾ <span>Moon</span> Design</div>
  <div id="status">Untitled Design</div>
  <div class="top-actions">
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
    <button onclick="exportPNG()">Export PNG</button>
  </div>
</header>

<div class="workspace">

  <aside class="toolbar">
    <div class="panel-title">TOOLS</div>
    <button class="tool active" onclick="setTool('select',this)">↖</button>
    <button class="tool" onclick="addShape('rect')">□</button>
    <button class="tool" onclick="addShape('circle')">○</button>
    <button class="tool" onclick="addText()">T</button>
  </aside>

  <aside class="sidebar">
    <div class="panel-title">LAYERS</div>
    <div id="layers"></div>
    <div class="row">
      <button onclick="addShape('rect')">+ Shape</button>
      <button onclick="addText()">+ Text</button>
    </div>
  </aside>

  <main class="stage">
    <div id="canvas"></div>
  </main>

  <aside class="sidebar right">
    <div class="panel-title">INSPECTOR</div>
    <div id="properties">
      <p style="color:#858b99;font-size:13px">
        Select an object to edit its properties.
      </p>
    </div>
  </aside>

</div>

<script>
const canvas = document.getElementById("canvas");
const layers = document.getElementById("layers");
const properties = document.getElementById("properties");

let objects = [];
let selected = null;
let tool = "select";
let nextId = 1;
let history = [];
let future = [];

function saveHistory() {
  history.push(JSON.stringify(objects));
  if (history.length > 50) history.shift();
  future = [];
}

function undo() {
  if (!history.length) return;
  future.push(JSON.stringify(objects));
  objects = JSON.parse(history.pop());
  selected = null;
  render();
}

function redo() {
  if (!future.length) return;
  history.push(JSON.stringify(objects));
  objects = JSON.parse(future.pop());
  selected = null;
  render();
}

function setTool(name, button) {
  tool = name;
  document.querySelectorAll(".tool").forEach(b =>
    b.classList.remove("active")
  );
  if (button) button.classList.add("active");
}

function addShape(type) {
  saveHistory();

  const item = {
    id: nextId++,
    type,
    name: type === "rect" ? "Rectangle" : "Circle",
    x: 100,
    y: 100,
    width: 150,
    height: 120,
    color: "#879abb",
    text: ""
  };

  objects.push(item);
  selected = item.id;
  render();
}

function addText() {
  saveHistory();

  const item = {
    id: nextId++,
    type: "text",
    name: "Text",
    x: 120,
    y: 120,
    width: 300,
    height: 65,
    color: "#202633",
    text: "Your text",
    fontSize: 32
  };

  objects.push(item);
  selected = item.id;
  render();
}

function render() {
  canvas.innerHTML = "";

  objects.forEach(item => {
    const el = document.createElement("div");
    el.className = "object";
    if (item.id === selected) el.classList.add("selected");

    Object.assign(el.style, {
      left: item.x + "px",
      top: item.y + "px",
      width: item.width + "px",
      height: item.height + "px",
      background: item.type === "text" ? "transparent" : item.color,
      borderRadius: item.type === "circle" ? "50%" : "0",
      color: item.type === "text" ? item.color : "inherit",
      fontSize: (item.fontSize || 32) + "px",
      fontFamily: "Alegreya, serif",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      whiteSpace: "pre-wrap"
    });

    el.textContent = item.type === "text" ? item.text : "";

    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();

      selected = item.id;
      render();

      const startX = e.clientX;
      const startY = e.clientY;
      const oldX = item.x;
      const oldY = item.y;
      const scaleX = canvas.getBoundingClientRect().width / 900;
      const scaleY = canvas.getBoundingClientRect().height / 560;

      const move = ev => {
        item.x = Math.max(0, Math.min(900 - item.width,
          oldX + (ev.clientX - startX) / scaleX));
        item.y = Math.max(0, Math.min(560 - item.height,
          oldY + (ev.clientY - startY) / scaleY));

        const current = canvas.querySelector(
          `[data-object="${item.id}"]`
        );

        if (current) {
          current.style.left = item.x + "px";
          current.style.top = item.y + "px";
        }
      };

      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        render();
      };

      saveHistory();
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });

    el.dataset.object = item.id;
    canvas.appendChild(el);
  });

  renderLayers();
  renderProperties();
}

canvas.addEventListener("pointerdown", e => {
  if (e.target === canvas) {
    selected = null;
    render();
  }
});

function renderLayers() {
  layers.innerHTML = "";

  [...objects].reverse().forEach(item => {
    const el = document.createElement("div");
    el.className = "layer" +
      (item.id === selected ? " selected" : "");

    el.textContent = item.name;
    el.onclick = () => {
      selected = item.id;
      render();
    };

    layers.appendChild(el);
  });
}

function renderProperties() {
  const item = objects.find(o => o.id === selected);

  if (!item) {
    properties.innerHTML =
      '<p style="color:#858b99;font-size:13px">Select an object to edit.</p>';
    return;
  }

  properties.innerHTML = `
    <label>Layer name</label>
    <input id="pName" value="${item.name}">
    <label>Position X</label>
    <input id="pX" type="number" value="${item.x}">
    <label>Position Y</label>
    <input id="pY" type="number" value="${item.y}">
    <label>Width</label>
    <input id="pW" type="number" min="1" value="${item.width}">
    <label>Height</label>
    <input id="pH" type="number" min="1" value="${item.height}">
    <label>Fill / Text Color</label>
    <input id="pColor" type="color" value="${item.color}">
    ${item.type === "text" ? `
      <label>Text content</label>
      <input id="pText" value="${item.text.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}">
      <label>Font size</label>
      <input id="pFont" type="number" min="8" max="150" value="${item.fontSize}">
    ` : ""}
    <div class="row">
      <button id="duplicate">Duplicate</button>
      <button id="delete">Delete</button>
    </div>
  `;

  const bind = (id, property, number = false) => {
    const input = document.getElementById(id);
    input.addEventListener("change", () => {
      saveHistory();
      item[property] = number ? Number(input.value) : input.value;
      if (number && !Number.isFinite(item[property])) return;
      if (["width","height","fontSize"].includes(property))
        item[property] = Math.max(1, item[property]);
      render();
    });
  };

  bind("pName", "name");
  bind("pX", "x", true);
  bind("pY", "y", true);
  bind("pW", "width", true);
  bind("pH", "height", true);
  bind("pColor", "color");

  if (item.type === "text") {
    bind("pText", "text");
    bind("pFont", "fontSize", true);
  }

  document.getElementById("delete").onclick = () => {
    saveHistory();
    objects = objects.filter(o => o.id !== selected);
    selected = null;
    render();
  };

  document.getElementById("duplicate").onclick = () => {
    saveHistory();
    const copy = {...item, id: nextId++, name: item.name + " Copy",
      x: Math.min(900 - item.width, item.x + 25),
      y: Math.min(560 - item.height, item.y + 25)};
    objects.push(copy);
    selected = copy.id;
    render();
  };
}

async function exportPNG() {
  if (!window.html2canvas) {
    await new Promise(resolve => {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      script.onload = resolve;
      document.head.appendChild(script);
    });
  }

  const old = selected;
  selected = null;
  render();

  const image = await html2canvas(canvas, {scale: 2});
  const link = document.createElement("a");
  link.download = "moon-design.png";
  link.href = image.toDataURL("image/png");
  link.click();

  selected = old;
  render();
}

saveHistory();
render();
</script>

</body>
</html>
